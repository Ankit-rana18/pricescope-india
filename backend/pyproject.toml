[project]
name = "pricescope-backend"
version = "0.1.0"
description = "PriceScope India API: product price comparison across Indian marketplaces."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "structlog>=24.4",
  "redis>=5.2",
  "gspread>=6.1",
  "google-auth>=2.35",
  "httpx>=0.28",
  "pricescope-integrations",
  "pricescope-workers",
  "rapidfuzz>=3.10",
  "anthropic>=0.70",
  "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.uv]
package = false

[tool.uv.sources]
pricescope-integrations = { path = "../integrations", editable = true }
pricescope-workers = { path = "../workers", editable = true }

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", "../tests"]
addopts = "-ra --strict-markers"
markers = [
  "db: requires a reachable PostgreSQL (PRICESCOPE_DATABASE_URL); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "../integrations/pricescope_integrations", "../workers/pricescope_workers"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]
