[project]
name = "pricescope-workers"
version = "0.1.0"
description = "Celery workers for PriceScope India: concurrent marketplace fetches."
requires-python = ">=3.12,<3.14"
dependencies = ["celery[redis]>=5.4", "pricescope-integrations"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricescope_workers"]

[tool.uv.sources]
pricescope-integrations = { path = "../integrations", editable = true }
