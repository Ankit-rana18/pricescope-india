[project]
name = "pricescope-integrations"
version = "0.1.0"
description = "Marketplace adapters for PriceScope India (real-integration shells + labelled demo data)."
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pricescope_integrations"]
